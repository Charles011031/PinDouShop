<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>拼豆店 · 工位看板</title>
<meta name="app-ver" content="v0.3.1">
<style>
:root{
  --bg:#f4efe6; --bg2:#fbf8f2; --card:#ffffff; --ink:#241f1a; --ink2:#4b4239; --muted:#7c7064;
  --line:#e5dbcc; --line2:#efe7db; --accent:#e2602f; --accent-soft:#fbe8de;
  --teal:#2c7a6b; --teal-soft:#e4f1ed; --blue:#3a6ea8; --violet:#7a5aa8;
  --gold:#b9861f; --ok:#2f8a57; --bad:#bd4a38; --warn:#b07a16;
  --r:16px; --shadow:0 1px 2px rgba(50,35,20,.04), 0 10px 26px rgba(50,35,20,.06);
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(rgba(90,70,50,.045) 1px,transparent 1px);background-size:18px 18px;
  -webkit-font-smoothing:antialiased;line-height:1.55}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding:0 22px}
.muted{color:var(--muted)}
.xsmall{font-size:11.5px}
.small{font-size:12.5px}

/* top · 模仿天胡：圆角渐变卡片，标题+版本 / 参数摘要 / 图标按钮 */
.top-wrap{padding-top:28px}
.top-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#3a2b22 0%,#241f1a 55%,#1d1813 100%);
  color:#fff;border-radius:18px;padding:16px 18px 14px;box-shadow:0 16px 40px rgba(50,35,20,.18)}
.top-card:before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,rgba(226,96,47,.5),rgba(226,96,47,0) 68%)}
.top-card:after{content:"";position:absolute;left:35%;bottom:-120px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,rgba(44,122,107,.35),rgba(44,122,107,0) 70%)}
.head-top{display:flex;align-items:flex-start;gap:12px;position:relative;z-index:1;flex-wrap:wrap}
.head-title{min-width:0;flex:1 1 340px}
.head-title h1{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:850;letter-spacing:-.02em;white-space:nowrap;margin:0}
.head-title .sub{font-size:11.5px;color:#cdbfae;margin-top:4px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;line-height:1.5}
.head-title .sub .sep{opacity:.35}
.head-title .sub .clock{font-family:var(--mono);color:#e8dccd}
.head-right{display:flex;align-items:center;gap:7px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:1;flex:0 1 auto}
.cfg-sum{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.22);
  color:#f3e9dc;border-radius:10px;padding:7px 10px;font-size:11.5px;font-weight:650;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.cfg-sum:hover{background:rgba(255,255,255,.18)}
.cfg-sum .caret{width:6px;height:6px;border-right:1.5px solid #d8c9b7;border-bottom:1.5px solid #d8c9b7;transform:rotate(45deg);margin-top:-3px;flex:none}
.sync{font-size:10.5px;font-weight:750;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#e5d8c8;border:1px solid rgba(255,255,255,.18);white-space:nowrap}
.sync.ok{background:rgba(58,140,110,.28);color:#c8ecdd;border-color:rgba(120,205,175,.32)}
.sync.err{background:rgba(190,70,50,.28);color:#ffd6ca;border-color:rgba(230,120,100,.35)}
.icon-btn{width:34px;height:34px;padding:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#f3e9dc;transition:.12s;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.ver{font-family:var(--mono);font-size:10px;font-weight:750;color:#f0e4d5;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  border-radius:7px;padding:3px 6px;cursor:pointer}
.ver:hover{background:rgba(255,255,255,.2);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;transition:.12s;white-space:nowrap}
.btn:hover{border-color:#cfc3b1;transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#3a3128}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.acc:hover{background:#c9501f}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line2);color:var(--ink)}
.btn.sm{padding:5px 8px;font-size:11px;border-radius:8px}
.btn.lg{padding:11px 16px;font-size:13.5px;border-radius:12px}

/* summary */
main.wrap{padding:22px 0 44px;flex:1 0 auto}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .s{font-size:10.5px;color:var(--muted);margin-top:1px}
.stat.acc .v{color:var(--accent)} .stat.teal .v{color:var(--teal)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.board-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.board-head h2{font-size:17px;font-weight:850}
.board-head .legend{margin-left:auto;display:flex;gap:10px;font-size:10.5px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.seat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 11px 10px;min-height:156px;display:flex;flex-direction:column;transition:.15s;box-shadow:0 1px 2px rgba(50,35,20,.03)}
.seat:hover{box-shadow:var(--shadow)}
.seat.running{border-color:#f0b499;background:linear-gradient(180deg,#fff,#fff8f4)}
.seat.paused{border-color:#e6d3a8;background:linear-gradient(180deg,#fff,#fffbf0)}
.seat .sh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.seat .no{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:750;padding:2px 6px;border-radius:5px;background:#f2ece2;color:var(--ink2);white-space:nowrap}
.badge.smart{background:#e6edf7;color:#2b5686}.badge.normal{background:#eef0e7;color:#57613b}
.badge.run{background:#fbe9e0;color:#b34518}.badge.pause{background:#f8efd8;color:#8a6512}
.seat .timer{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:9px 0 1px}
.seat.idle .timer{color:#c7bbab;font-size:22px}
.seat .sub{font-size:10.5px;color:var(--muted);min-height:16px;line-height:1.4}
.seat .amt{font-family:var(--mono);font-size:13px;font-weight:800;margin-top:2px}
.seat .acts{display:flex;gap:5px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.seat .acts .btn{flex:1;padding:6px 5px;font-size:10.5px;border-radius:8px;min-width:0}
.seat .acts .btn.wide{flex:1 1 100%}
.seat .hint{font-size:10px;color:var(--muted);margin-top:2px}
.idle-pick{display:flex;gap:5px;margin-top:auto;padding-top:8px}

/* panels */
aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line2);background:#fdfaf5}
.panel-h h3{font-size:13px}
.panel-h .count{font-size:10.5px;color:var(--muted);font-weight:700}
.panel-b{padding:11px 13px}
.rec-item{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:6px 0;border-bottom:1px dashed var(--line2)}
.rec-item:last-child{border-bottom:0}
.rec-item .l{color:var(--muted)}
.rec-item b{font-family:var(--mono)}
.empty{font-size:11.5px;color:var(--muted);padding:6px 0}
.panel-note{font-size:10.5px;color:var(--muted);padding:8px 13px;background:#fdfaf5;border-top:1px solid var(--line2);line-height:1.5}

.update{position:sticky;top:0;z-index:70;display:none;align-items:center;gap:9px;justify-content:center;
  background:#fff4d6;border-bottom:1px solid #ecd9a0;padding:8px 14px;font-size:12px;color:#6b4b08}
.update.on{display:flex}
.update b{font-family:var(--mono)}
.cl-sub{font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.cl-body{max-height:58vh;overflow:auto;margin:0 -4px;padding:0 4px;-webkit-overflow-scrolling:touch}
.cl-item{border-bottom:1px dashed var(--line2);padding:0}
.cl-item:last-child{border-bottom:0}
.cl-row{display:grid;width:100%;text-align:left;background:none;border:0;padding:10px 0;font:inherit;color:var(--ink);
  align-items:center;gap:2px 8px;grid-template-columns:auto auto 1fr auto;grid-template-areas:"ver date n arrow" "sum sum sum sum";cursor:pointer}
.cl-ver{grid-area:ver;display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--ink);border-radius:999px;padding:2px 9px;letter-spacing:.2px}
.cl-date{grid-area:date;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.cl-n{grid-area:n;font-size:11px;font-weight:700;color:var(--muted)}
.cl-arrow{grid-area:arrow;font-size:12px;font-weight:800;color:#9a8d7e;transition:transform .16s}
.cl-sum{grid-area:sum;margin-top:4px;font-size:13px;line-height:1.55;color:#3f362e;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cl-item.on{background:#fbf6ef;border-radius:10px;padding:0 10px;margin:0 -10px}
.cl-item.on .cl-sum{display:none}
.cl-item.on .cl-arrow{transform:rotate(180deg)}
.cl-detail{display:none}
.cl-item.on .cl-detail{display:block;padding-bottom:10px}
.cl-detail ul{margin:2px 0 0;padding-left:17px;font-size:12.5px;line-height:1.7;color:var(--ink2)}
.cl-detail li{margin:3px 0}
.cl-detail li b{color:var(--accent)}
.cl-detail code{background:#f2ece2;border-radius:4px;padding:0 4px;font-size:11.5px;font-family:var(--mono)}
.cl-more{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;margin-right:auto}
.cl-more:hover{text-decoration:underline}
.mbox.wide{max-width:620px}

/* modal */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(35,28,22,.5);backdrop-filter:blur(3px)}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:430px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.28);overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{opacity:.6;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line2);background:#fdfaf5}
.mhead b{font-size:14px}
.mbody{padding:15px 16px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:11px 16px;border-top:1px solid var(--line2);background:#fffdf9}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:750;color:var(--muted);margin-bottom:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink2)}
.segbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pricebox{background:#faf6ef;border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink2);line-height:1.6}
.receipt{border:1px dashed var(--line);border-radius:11px;padding:10px 12px;background:#fffdf7;font-size:11.5px;font-family:var(--mono)}
.receipt .rr{display:flex;justify-content:space-between;padding:2px 0}
.receipt .rr.tot{border-top:1px dashed var(--line);margin-top:5px;padding-top:6px;font-weight:800;font-size:13px}
.checkline{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0;cursor:pointer}
.checkline input{width:15px;height:15px;accent-color:var(--accent)}
.payopts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.payopt{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:700}
.payopt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.setgrid .field{margin:0}
.input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;font-family:var(--mono);background:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#241f1a;color:#fff;padding:9px 14px;border-radius:10px;font-size:12px;z-index:300;opacity:0;transition:.2s;pointer-events:none;max-width:80vw;text-align:center}
.toast.on{opacity:1}

@media(max-width:1100px){.layout{grid-template-columns:1fr}aside{position:static;display:grid;grid-template-columns:1fr 1fr}.seats{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){.summary{grid-template-columns:1fr 1fr}.seats{grid-template-columns:repeat(3,1fr)}aside{grid-template-columns:1fr}}
@media(max-width:820px){.top-card{padding:13px 14px 12px}.head-title{flex:1 1 100%}.head-title h1{font-size:20px}.head-right{width:100%;margin-left:0;justify-content:space-between}.cfg-sum{flex:1;max-width:none;justify-content:space-between}.head-date{display:none}}
@media(max-width:560px){.seats{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 14px}.seat{min-height:146px}.seat .timer{font-size:23px}.head-title h1{font-size:19px}.head-title .sub{font-size:10.5px}.sync{display:none}.icon-btn{width:31px;height:31px}}


/* ================= v0.3.0 视觉改版 ================= */
body{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  background-color:#f6f1e8;
  background-image:
    radial-gradient(1100px 520px at 88% -8%, rgba(226,96,47,.10), transparent 62%),
    radial-gradient(900px 520px at -8% 12%, rgba(44,122,107,.075), transparent 58%),
    radial-gradient(rgba(90,70,50,.045) 1px, transparent 1px);
  background-size:auto, auto, 18px 18px;
  min-height:100vh;
}
.top-wrap{padding-top:28px}
.top-card{box-shadow:0 18px 46px rgba(35,25,18,.20);border:1px solid rgba(255,255,255,.06)}
.head-title h1{font-size:23px;text-shadow:0 2px 10px rgba(0,0,0,.16)}
.head-title .sub{color:#c9b9a7;letter-spacing:.01em}
.cfg-sum{backdrop-filter:blur(6px)}
.sync{backdrop-filter:blur(6px)}

.summary{gap:12px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;padding:14px 16px 13px;border-radius:16px;transition:transform .16s,box-shadow .16s}
.stat:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(50,35,20,.09)}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;background:#e5d8c6}
.stat.acc{background:linear-gradient(135deg,#fff8f2 0%,#fff 62%);border-color:#f0d8c8}
.stat.acc:before{background:linear-gradient(#e2602f,#e9b949)}
.stat.teal:before{background:linear-gradient(#2c7a6b,#78c5b3)}
.stat:nth-child(4):before{background:linear-gradient(#7a5aa8,#c0a9e6)}
.stat .l{font-size:10.5px;letter-spacing:.06em;color:#84776a}
.stat .v{font-size:24px;margin-top:5px}
.stat .s{font-size:10px;color:#9a8c7d;margin-top:2px}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st-ico{width:28px;height:28px;border-radius:9px;background:#f7efe4;color:#a58a6e;display:grid;place-items:center;flex:none}
.stat.acc .st-ico{background:#fbe9df;color:#c05024}
.stat.teal .st-ico{background:#e6f2ee;color:#2c7a6b}
.st-ico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.board-head h2{letter-spacing:-.02em}
.seat{position:relative;overflow:hidden;border-radius:16px;border-color:#eadfd1;background:linear-gradient(180deg,#fffefa 0%,#fff 55%);
  box-shadow:0 1px 2px rgba(50,35,20,.035);transition:transform .16s,box-shadow .16s,border-color .16s}
.seat:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(50,35,20,.09)}
.seat.idle{background:linear-gradient(180deg,#fffdfa 0%,#fbf6ee 100%);border-style:dashed;border-color:#e7d9c7}
.seat.idle:hover{border-style:solid;border-color:#d9c6ad}
.seat.running{border-color:#efb69c;background:linear-gradient(180deg,#fffaf6 0%,#fff 62%);box-shadow:0 10px 24px rgba(226,96,47,.13)}
.seat.running:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(#e2602f,#e9b949)}
.seat.paused{border-color:#e4cc96;background:linear-gradient(180deg,#fffdf4 0%,#fff 62%)}
.seat.paused:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(#d8a72a,#e9c76a)}
.seat .sh{padding-left:1px}
.seat .no{display:inline-flex;align-items:center;background:#f4ece0;color:#6f5d4b;padding:2px 7px;border-radius:7px;font-size:9.5px;font-weight:800;letter-spacing:.02em}
.seat.running .no{background:#fbe5da;color:#b24418}
.seat.paused .no{background:#f8efd8;color:#8a6512}
.seat .timer{font-size:28px;margin-top:10px}
.seat.idle .timer{font-size:19px;letter-spacing:.12em;color:#c6b8a6}
.seat .sub{font-size:10px;color:#958777}
.seat .amt{font-size:13.5px;color:#3f362e}
.seat.running .amt{color:#b24418}
.seat .badge{font-size:9px;padding:2px 7px}
.seat.running .badge:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#e2602f;margin-right:2px;animation:pulse 1.4s infinite}
.idle-pick{gap:6px}
.idle-pick .btn{padding:7px 8px;font-size:11px;line-height:1.18;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border-radius:9px;min-width:0}
.idle-pick .btn small{font-family:var(--mono);font-size:9px;font-weight:600;opacity:.72;letter-spacing:-.02em}
.idle-pick .btn.acc{box-shadow:0 6px 14px rgba(226,96,47,.18)}
.seat .acts .btn{padding:6px 6px;border-radius:8px}

.panel{border-radius:16px;border-color:#eadfd1;box-shadow:0 10px 28px rgba(50,35,20,.06)}
.panel-h{background:linear-gradient(180deg,#fdf9f3,#fff);padding:12px 14px}
.panel-h h3{display:flex;align-items:center;gap:7px}
.pico{width:18px;height:18px;border-radius:6px;background:#fbe9df;color:#b34518;display:grid;place-items:center;font-size:10px;font-weight:800;font-family:var(--mono)}
.panel-b{padding:10px 12px}
.rec-item{border-bottom:0;border-radius:9px;padding:8px 7px;margin-bottom:2px;align-items:center;transition:background .12s}
.rec-item:hover{background:#fbf6ee}
.rec-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.rec-time{font-family:var(--mono);font-size:9.5px;color:#9a8c7d}
.rec-seat{font-size:11px;font-weight:800;color:#4b4036}

<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const money = n => "$" + (Math.round((+n || 0) * 100) / 100).toFixed(2);
const round2 = n => Math.round((+n || 0) * 100) / 100;
const pad2 = n => String(n).padStart(2, "0");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDur = ms => {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return [h, m, ss].map(pad2).join(":");
};
const nowTime = () => { const d = new Date(); return [pad2(d.getHours()), pad2(d.getMinutes()), pad2(d.getSeconds())].join(":"); };
const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
const TYPE = {smart:"智能板", normal:"普通板"};
const BILL = {hourly:"按小时", package:"2 小时套餐"};

/* Firebase：新表放在同一个 RTDB 的 shops/<新 key> 下，和天胡门店数据隔离 */
/* Firebase：独立项目 pindoushop 下的 shops/<key>/state；REST 轮询同步 */
const FB_URL = "https://pindoushop-default-rtdb.asia-southeast1.firebasedatabase.app/shops/pindou-b7f9a52ba498/state.json";
const FB_VER_URL = FB_URL.replace(/\/state\.json$/, "/__sysVer.json");
const APP_VER = "v0.3.1", APP_DATE = "2026-11-24";
// >>> APP_CHANGELOG BEGIN（自动生成，勿手改）
const APP_CHANGELOG = [
  { ver: "v0.3.1", date: "2026-11-24", sum: "调整顶部与统计卡间距", items: ["调整 顶部卡片上边距从 20px 到 28px，移动端为 18px", "调整 顶部卡片与统计卡之间增加 22px 间距", "修复 顶部卡片与内容区左右未对齐", "测试 桌面与移动端截图检查。"] },
  { ver: "v0.3.0", date: "2026-11-24", sum: "整体界面视觉改版", items: ["调整 顶部栏、统计卡、工位卡、收款列表、弹窗统一为暖色手作风格", "新增 统计卡图标、工位板型价签、收款方式标签与页脚", "优化 运行中、暂停工位增加状态色条与悬停反馈", "测试 Chrome 冒烟、更新日志生成与移动端截图。"] },
  { ver: "v0.2.3", date: "2026-11-24", sum: "更新日志改为手风琴并统一规范", items: ["调整 更新日志唯一来源改为 README 的「最近 15 个版本」表格，由 `生成更新日志.py` 注入页面", "新增 弹窗默认收起，一行显示版本、日期、条数、摘要，点一行展开详情", "调整 详情按「新增、调整、修复、移除、优化、测试」开头，摘要不超过 28 字", "新增 发布体检校验页面内嵌日志与 README 是否同步。"] },
  { ver: "v0.2.2", date: "2026-11-24", sum: "顶部栏改为天胡式卡片布局", items: ["调整 顶部栏改为圆角渐变卡片，标题与版本号同行", "新增 价格摘要显示两种板型时价与套餐价，点击打开设置", "调整 同步状态、刷新、设置改为图标按钮，移动端自动换行。"] },
  { ver: "v0.2.1", date: "2026-11-24", sum: "新增一键发布工具", items: ["新增 发布前版本、文件、Chrome、Firebase、GitHub 体检", "新增 发布锁、状态文件与发布日志", "优化 GitHub 改为一次 commit 原子提交", "新增 等线上生效后写 `__sysVer` 广播。"] },
  { ver: "v0.2.0", date: "2026-11-24", sum: "移除烫位队列并改到 Zetland", items: ["移除 烫位排队、熨烫中、可取件状态，结算收款即完成", "调整 顶部统计改为今日单数、平均客单", "调整 门店位置改为 Zetland", "新增 版本号、更新日志、发布后自动广播刷新。"] },
  { ver: "v0.1.0", date: "2026-11-24", sum: "第一版 10 工位看板上线", items: ["新增 10 个工位与智能板、普通板选择", "新增 按小时与 2 小时套餐计费", "新增 现金、刷卡、会员优惠结算", "新增 Firebase 多设备同步与 GitHub Pages 部署。"] },
];
// <<< APP_CHANGELOG END（自动生成，勿手改）

const DEFAULT_SETTINGS = {
  smartHourly: 15, normalHourly: 10,
  smartPackage: 28, normalPackage: 18,
  packageMinutes: 120,
  smartExtra: 3.75, normalExtra: 2.5,
  cardFee: 1.2, memberDiscount: 10
};
function freshState(){
  return {
    version: 1,
    settings: Object.assign({}, DEFAULT_SETTINGS),
    seats: Array.from({length:10}, (_, i) => ({id:i + 1, status:"idle", type:null, billing:null, startAt:0, accMs:0, price:null, last:null})),
    records: [], updatedAt: 0
  };
}
function normalize(v){
  const base = freshState();
  if (!v || typeof v !== "object") return base;
  base.settings = Object.assign({}, DEFAULT_SETTINGS, v.settings || {});
  base.seats = Array.from({length:10}, (_, i) => {
    const d = (v.seats || []).find(x => x && +x.id === i + 1) || {};
    return Object.assign({id:i + 1, status:"idle", type:null, billing:null, startAt:0, accMs:0, price:null, last:null}, d);
  });
  base.records = Array.isArray(v.records) ? v.records.filter(r => r && r.id) : [];
  base.updatedAt = +v.updatedAt || 0;
  return base;
}
const STORE_KEY = "pindou_board_v1";
let state = freshState();
let pushing = false, pushTimer = null;

function loadLocal(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    state = raw ? normalize(JSON.parse(raw)) : freshState();
  } catch (e){ state = freshState(); }
}
function saveLocal(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e){}
}
function setSync(text, ok){
  const el = $("#syncBadge");
  el.textContent = text;
  el.className = "sync" + (ok ? " ok" : (text === "本地" ? "" : " err"));
}
function touch(){
  state.updatedAt = Date.now();
  saveLocal();
  renderAll();
  queuePush();
}
function nextId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* 计时与计价 */
const elapsed = s => (s.accMs || 0) + (s.status === "running" ? Date.now() - s.startAt : 0);
function snapshot(type, billing){
  const s = state.settings;
  return {
    hourly: type === "smart" ? +s.smartHourly : +s.normalHourly,
    package: type === "smart" ? +s.smartPackage : +s.normalPackage,
    extra15: type === "smart" ? +s.smartExtra : +s.normalExtra,
    packageMinutes: +s.packageMinutes
  };
}
function billFor(seat, ms){
  const p = seat.price || snapshot(seat.type, seat.billing);
  if (seat.billing === "hourly"){
    const minutes = Math.max(30, Math.ceil(ms / 60000 / 15) * 15);
    return {minutes, amount:round2(minutes / 60 * p.hourly), detail:minutes + " 分钟 × A$" + p.hourly + "/小时"};
  }
  const mins = ms / 60000;
  const blocks = Math.max(0, Math.ceil((mins - p.packageMinutes) / 15));
  const extra = round2(blocks * p.extra15);
  return {minutes:Math.ceil(mins), amount:round2(p.package + extra), base:p.package, blocks, extra, detail:"含 " + p.packageMinutes + " 分钟" + (blocks ? " + 超时 " + blocks + "×15 分钟" : "")};
}

/* 渲染 */
function renderCfgSum(){
  const s = state.settings;
  $("#cfgSumText").textContent = "智能 $" + s.smartHourly + "/h · 普通 $" + s.normalHourly + "/h · 套餐 $" + s.smartPackage + "/$" + s.normalPackage;
}
function renderAll(){
  renderSeats();
  renderSummary();
  renderRecords();
  renderCfgSum();
}
function priceLabel(type){
  const s = state.settings;
  return "$" + (type === "smart" ? s.smartHourly : s.normalHourly) + "/h 起";
}
function renderSeats(){
  $("#seats").innerHTML = state.seats.map(s => {
    const num = pad2(s.id);
    if (s.status === "idle"){
      return `<div class="seat idle">
        <div class="sh"><span class="no">${num} 号</span><span class="badge">空闲</span></div>
        <div class="timer">— — —</div>
        <div class="sub">${s.last ? "上一单 " + money(s.last.amount) + " · " + (s.last.time || "") : "选板型开台"}</div>
        <div class="idle-pick">
          <button class="btn acc pick" data-act="open" data-id="${s.id}" data-type="smart"><span>智能板</span><small>${priceLabel("smart")}</small></button>
          <button class="btn pick" data-act="open" data-id="${s.id}" data-type="normal"><span>普通板</span><small>${priceLabel("normal")}</small></button>
        </div>
      </div>`;
    }
    const ms = elapsed(s), b = billFor(s, ms);
    return `<div class="seat ${s.status}">
      <div class="sh"><span class="no">${num} 号</span><span class="badge ${s.type}">${TYPE[s.type]} · ${BILL[s.billing]}</span></div>
      <div class="timer" data-timer="${s.id}">${fmtDur(ms)}</div>
      <div class="sub">${s.status === "paused" ? "已暂停" : (s.billing === "hourly" ? "A$" + (s.price ? s.price.hourly : "") + "/小时 · 15 分钟进位" : "2 小时套餐 · 超时 A$" + (s.price ? s.price.extra15 : "") + "/15 分钟")}</div>
      <div class="amt" data-amt="${s.id}">预估 ${money(b.amount)}</div>
      <div class="acts">
        ${s.status === "running"
          ? `<button class="btn" data-act="pause" data-id="${s.id}">暂停</button>`
          : `<button class="btn" data-act="resume" data-id="${s.id}">继续</button>`}
        <button class="btn primary" data-act="finish" data-id="${s.id}">结束</button>
      </div>
    </div>`;
  }).join("");
}
function renderSummary(){
  const today = todayKey();
  const rows = state.records.filter(r => r.date === today);
  const rev = rows.reduce((a, r) => a + (+r.amount || 0), 0);
  const active = state.seats.filter(s => s.status !== "idle").length;
  $("#sumRev").textContent = money(rev);
  $("#sumSub").textContent = "已收款";
  $("#sumActive").textContent = active + " / 10";
  $("#sumActiveSub").textContent = "利用率 " + Math.round(active / 10 * 100) + "%";
  $("#sumOrders").textContent = rows.length;
  $("#sumAvg").textContent = money(rows.length ? rev / rows.length : 0);
}
function renderRecords(){
  const today = todayKey();
  const rows = state.records.filter(r => r.date === today).slice().reverse().slice(0, 8);
  $("#recCount").textContent = state.records.filter(r => r.date === today).length + " 笔";
  $("#records").innerHTML = rows.length ? rows.map(r =>
    `<div class="rec-item"><span class="rec-l"><span class="rec-time">${r.time}</span><span class="rec-seat">${pad2(r.seatId)} 号</span><span class="rec-type">${TYPE[r.type] || ""}</span></span><span class="rec-r"><b>${money(r.amount)}</b><span class="pay-tag">${r.pay}</span></span></div>`
  ).join("") : `<div class="empty">今天还没有收款。</div>`;
}

/* 计时刷新 */
function tick(){
  const now = new Date();
  $("#clockTxt").textContent = nowTime();
  $("#dateTxt").textContent = now.toLocaleDateString("zh-CN", {month:"long", day:"numeric", weekday:"long"});
  state.seats.forEach(s => {
    if (s.status !== "running") return;
    const ms = elapsed(s), b = billFor(s, ms);
    const t = document.querySelector('[data-timer="' + s.id + '"]');
    if (t) t.textContent = fmtDur(ms);
    const a = document.querySelector('[data-amt="' + s.id + '"]');
    if (a) a.textContent = "预估 " + money(b.amount);
  });
}

/* 模态框 */
let M = {build:null, click:null};
function openModal(title, build, click, wide){
  M = {build, click};
  $("#mTitle").textContent = title;
  $(".mbox").classList.toggle("wide", !!wide);
  $("#modal").classList.add("on");
  build();
}
function closeModal(){ $("#modal").classList.remove("on"); $(".mbox").classList.remove("wide"); M = {build:null, click:null}; }
$("#mClose").addEventListener("click", closeModal);
$("#modal").addEventListener("click", e => { if (e.target === $("#modal")) closeModal(); });
$("#mBody").addEventListener("click", e => { if (M.click) M.click(e); });
$("#mFoot").addEventListener("click", e => { if (M.click) M.click(e); });
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200);
}

/* 开台 */
function openSeatModal(seatId, type){
  const seat = state.seats[seatId - 1];
  let selType = type === "normal" ? "normal" : "smart";
  let selBill = "hourly";
  const build = () => {
    const st = state.settings;
    const rate = selType === "smart" ? st.smartHourly : st.normalHourly;
    const pkg = selType === "smart" ? st.smartPackage : st.normalPackage;
    const extra = selType === "smart" ? st.smartExtra : st.normalExtra;
    const info = selBill === "hourly"
      ? `A$${rate} / 小时 · 15 分钟进位 · 最低 30 分钟`
      : `A$${pkg} / 2 小时（含豆）· 超时 A$${extra}/15 分钟`;
    $("#mBody").innerHTML = `
      <div class="field"><label>板型</label>
        <div class="seg">
          <button class="segbtn ${selType === "smart" ? "on" : ""}" data-t="smart">智能板</button>
          <button class="segbtn ${selType === "normal" ? "on" : ""}" data-t="normal">普通板</button>
        </div>
      </div>
      <div class="field"><label>计费方式（开台后锁定）</label>
        <div class="seg">
          <button class="segbtn ${selBill === "hourly" ? "on" : ""}" data-b="hourly">按小时</button>
          <button class="segbtn ${selBill === "package" ? "on" : ""}" data-b="package">2 小时套餐</button>
        </div>
      </div>
      <div class="pricebox">${info}<br>豆子不限量，已含在时长/套餐内。</div>`;
    $("#mFoot").innerHTML = `<button class="btn" data-act="cancel">取消</button>
      <button class="btn acc" data-act="start">开始计时</button>`;
  };
  openModal(`开台 · ${pad2(seatId)} 号工位`, build, e => {
    const t = e.target.closest("[data-t]");
    if (t){ selType = t.dataset.t; build(); return; }
    const b = e.target.closest("[data-b]");
    if (b){ selBill = b.dataset.b; build(); return; }
    const act = e.target.closest("[data-act]");
    if (!act) return;
    if (act.dataset.act === "cancel"){ closeModal(); return; }
    if (act.dataset.act === "start"){
      Object.assign(seat, {
        status:"running", type:selType, billing:selBill,
        startAt:Date.now(), accMs:0, price:snapshot(selType, selBill), last:null
      });
      touch(); closeModal(); toast(`${pad2(seatId)} 号工位 · ${TYPE[selType]} · ${BILL[selBill]} 开始计时`);
    }
  });
}
$("#seats").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const seat = state.seats[+btn.dataset.id - 1];
  const act = btn.dataset.act;
  if (act === "open"){ openSeatModal(seat.id, btn.dataset.type); return; }
  if (act === "pause"){ seat.accMs = elapsed(seat); seat.startAt = 0; seat.status = "paused"; touch(); }
  else if (act === "resume"){ seat.startAt = Date.now(); seat.status = "running"; touch(); }
  else if (act === "finish"){
    const ms = elapsed(seat);
    seat.accMs = ms; seat.startAt = 0; seat.status = "paused";
    openSettle(seat, ms);
    renderSeats();
  }
});

/* 结算 */
function openSettle(seat, ms){
  const b = billFor(seat, ms);
  const draft = {member:false, pay:"cash"};
  const build = () => {
    const st = state.settings;
    const disc = draft.member ? round2(b.amount * (+st.memberDiscount || 0) / 100) : 0;
    const sub = round2(b.amount - disc);
    const fee = draft.pay === "card" ? Math.ceil(sub * (+st.cardFee || 0) / 100 * 100) / 100 : 0;
    const total = round2(sub + fee);
    $("#mBody").innerHTML = `
      <div class="receipt">
        <div class="rr"><span>工位</span><span>${pad2(seat.id)} 号 · ${TYPE[seat.type]}</span></div>
        <div class="rr"><span>时长</span><span>${fmtDur(ms)}（${b.minutes} 分钟）</span></div>
        <div class="rr"><span>${BILL[seat.billing]} · ${b.detail}</span><span>${money(b.amount)}</span></div>
        ${disc ? `<div class="rr"><span>会员 ${st.memberDiscount}% 优惠</span><span>−${money(disc)}</span></div>` : ""}
        ${fee ? `<div class="rr"><span>刷卡手续费 ${st.cardFee}%</span><span>${money(fee)}</span></div>` : ""}
        <div class="rr tot"><span>应收</span><span>${money(total)}</span></div>
      </div>
      <label class="checkline" style="margin-top:11px"><input type="checkbox" id="memChk" ${draft.member ? "checked" : ""}> 会员 ${state.settings.memberDiscount}% 优惠</label>
      <div class="field" style="margin:9px 0 0"><label>怎么收</label>
        <div class="payopts">
          <button class="payopt ${draft.pay === "cash" ? "on" : ""}" data-pay="cash">💵 现金</button>
          <button class="payopt ${draft.pay === "card" ? "on" : ""}" data-pay="card">💳 刷卡 +${state.settings.cardFee}%</button>
        </div>
      </div>
      <div class="xsmall muted" style="margin-top:9px">收款后本单完成；板子和豆子不单独收费。</div>`;
    $("#mFoot").innerHTML = `<button class="btn" data-act="cancel">取消</button>
      <button class="btn acc" data-act="ok">收款 ${money(total)}</button>`;
  };
  openModal(`结算 · ${pad2(seat.id)} 号工位`, build, e => {
    if (e.target.id === "memChk"){ draft.member = e.target.checked; build(); return; }
    const pay = e.target.closest("[data-pay]");
    if (pay){ draft.pay = pay.dataset.pay; build(); return; }
    const act = e.target.closest("[data-act]");
    if (!act) return;
    if (act.dataset.act === "cancel"){ seat.status = "paused"; closeModal(); renderSeats(); return; }
    if (act.dataset.act === "ok"){
      const st = state.settings;
      const disc = draft.member ? round2(b.amount * (+st.memberDiscount || 0) / 100) : 0;
      const sub = round2(b.amount - disc);
      const fee = draft.pay === "card" ? Math.ceil(sub * (+st.cardFee || 0) / 100 * 100) / 100 : 0;
      const total = round2(sub + fee);
      const payLabel = draft.pay === "card" ? "刷卡" : "现金";
      state.records.push({id:nextId(), seatId:seat.id, type:seat.type, amount:total, pay:payLabel, minutes:b.minutes, time:nowTime(), date:todayKey()});
      Object.assign(seat, {status:"idle", type:null, billing:null, startAt:0, accMs:0, price:null, last:{amount:total, time:nowTime()}});
      touch(); closeModal(); toast(`${pad2(seat.id)} 号收款 ${money(total)}，本单完成`);
    }
  });
}

/* 更新日志（数据由 生成更新日志.py 从 README 注入） */
function clLine(s){
  return esc(String(s == null ? "" : s))
    .replace(/^(新增|调整|修复|移除|优化|测试)\s/, "<b>$1</b> ")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function clSum(it){
  const s = (it && it.sum) ? String(it.sum).trim() : "";
  if (s) return s;
  const items = (it && it.items) || [];
  const t = items.length ? String(items[0]).replace(/\*\*/g, "").replace(/`/g, "").trim() : "";
  return t.length > 40 ? t.slice(0, 40) + "…" : t;
}
function openChangelog(){
  openModal("更新日志", () => {
    const list = (typeof APP_CHANGELOG !== "undefined" && APP_CHANGELOG) || [];
    $("#mBody").innerHTML = `<div class="cl-sub">当前 ${APP_VER} · ${APP_DATE} · 最近 ${list.length} 个版本 · 点一行看详情</div><div class="cl-body">` +
      (list.length ? list.map((it, i) => {
        const items = it.items || [];
        return `<div class="cl-item" data-i="${i}">
          <button class="cl-row" type="button" aria-expanded="false">
            <span class="cl-ver">${esc(it.ver || "")}</span>
            <span class="cl-date">${esc(it.date || "")}</span>
            <span class="cl-n">${items.length} 条</span>
            <span class="cl-arrow">▾</span>
            <span class="cl-sum">${esc(clSum(it))}</span>
          </button>
          <div class="cl-detail"><ul>${items.map(x => `<li>${clLine(x)}</li>`).join("")}</ul></div>
        </div>`;
      }).join("") : `<div class="cl-sub">暂无更新日志</div>`) + `</div>`;
    $("#mFoot").innerHTML = `<a class="cl-more" href="https://github.com/Charles011031/PinDouShop/blob/main/${encodeURIComponent("版本记录.md")}" target="_blank" rel="noopener">完整版本记录</a><button class="btn" data-act="close">关闭</button>`;
  }, e => {
    const row = e.target.closest(".cl-row");
    if (row){
      const item = row.closest(".cl-item");
      const was = item.classList.contains("on");
      $$(".cl-item").forEach(x => x.classList.remove("on"));
      $$(".cl-row").forEach(x => x.setAttribute("aria-expanded", "false"));
      if (!was){ item.classList.add("on"); row.setAttribute("aria-expanded", "true"); }
      return;
    }
    if (e.target.closest('[data-act="close"]')) closeModal();
  }, true);
}
$("#verBtn").addEventListener("click", openChangelog);

/* 版本广播：发布后所有打开页面自动刷新 */
let updatePending = false;
function isBusyForReload(){
  if ($("#modal").classList.contains("on")) return true;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  return state.seats.some(s => s.status !== "idle");
}
function showUpdate(ver){
  updatePending = true;
  $("#upVer").textContent = ver;
  $("#updateBar").classList.add("on");
}
function reloadTo(ver){
  location.replace(location.pathname + "?v=" + encodeURIComponent(ver) + "&t=" + Date.now());
}
function isNewerVer(a, b){
  const A = String(a).replace(/^v/i, "").split(".").map(x => parseInt(x, 10) || 0);
  const B = String(b).replace(/^v/i, "").split(".").map(x => parseInt(x, 10) || 0);
  for (let i = 0; i < Math.max(A.length, B.length); i++){
    const x = A[i] || 0, y = B[i] || 0;
    if (x !== y) return x > y;
  }
  return false;
}
async function checkVersion(){
  if (!FB_VER_URL || document.hidden) return;
  try {
    const r = await fetch(FB_VER_URL + "?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const v = await r.json();
    if (!v || !v.ver) return;
    if (!isNewerVer(v.ver, APP_VER)){ $("#updateBar").classList.remove("on"); return; }
    if (isBusyForReload()) showUpdate(v.ver);
    else reloadTo(v.ver);
  } catch (e){}
}
$("#upBtn").addEventListener("click", () => reloadTo($("#upVer").textContent || APP_VER));
$("#upLater").addEventListener("click", () => $("#updateBar").classList.remove("on"));
setInterval(checkVersion, 20000);
setTimeout(checkVersion, 1800);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });

/* 设置 / 刷新 / 价格摘要 */
$("#cfgSum").addEventListener("click", openSettings);
$("#refreshBtn").addEventListener("click", () => location.replace(location.pathname + "?t=" + Date.now()));
$("#settingsBtn").addEventListener("click", openSettings);
function openSettings(){
  const s = state.settings;
  const build = () => {
    $("#mBody").innerHTML = `
      <div class="setgrid">
        <div class="field"><label>智能板 · 每小时 (A$)</label><input class="input" id="setSmartHourly" type="number" min="0" step="0.5" value="${s.smartHourly}"></div>
        <div class="field"><label>普通板 · 每小时 (A$)</label><input class="input" id="setNormalHourly" type="number" min="0" step="0.5" value="${s.normalHourly}"></div>
        <div class="field"><label>智能板 · 2h 套餐 (A$)</label><input class="input" id="setSmartPackage" type="number" min="0" step="1" value="${s.smartPackage}"></div>
        <div class="field"><label>普通板 · 2h 套餐 (A$)</label><input class="input" id="setNormalPackage" type="number" min="0" step="1" value="${s.normalPackage}"></div>
        <div class="field"><label>套餐含多少分钟</label><input class="input" id="setPackageMinutes" type="number" min="30" step="15" value="${s.packageMinutes}"></div>
        <div class="field"><label>刷卡手续费 %</label><input class="input" id="setCardFee" type="number" min="0" step="0.1" value="${s.cardFee}"></div>
        <div class="field"><label>智能板超时 / 15 分钟</label><input class="input" id="setSmartExtra" type="number" min="0" step="0.25" value="${s.smartExtra}"></div>
        <div class="field"><label>普通板超时 / 15 分钟</label><input class="input" id="setNormalExtra" type="number" min="0" step="0.25" value="${s.normalExtra}"></div>
        <div class="field"><label>会员优惠 %</label><input class="input" id="setMemberDiscount" type="number" min="0" max="50" step="1" value="${s.memberDiscount}"></div>
      </div>
      <div class="xsmall muted" style="margin-top:10px">价格只影响新开的工单；进行中的按开台时锁定的价格结算。</div>`;
    $("#mFoot").innerHTML = `<button class="btn" data-act="cancel">取消</button><button class="btn acc" data-act="save">保存</button>`;
  };
  openModal("设置 · 价格", build, e => {
    const act = e.target.closest("[data-act]"); if (!act) return;
    if (act.dataset.act === "cancel"){ closeModal(); return; }
    if (act.dataset.act === "save"){
      const val = id => Math.max(0, parseFloat($(id).value) || 0);
      state.settings = {
        smartHourly:val("#setSmartHourly"), normalHourly:val("#setNormalHourly"),
        smartPackage:val("#setSmartPackage"), normalPackage:val("#setNormalPackage"),
        packageMinutes:Math.max(30, val("#setPackageMinutes")),
        cardFee:val("#setCardFee"),
        smartExtra:val("#setSmartExtra"), normalExtra:val("#setNormalExtra"),
        memberDiscount:Math.min(50, val("#setMemberDiscount"))
      };
      touch(); closeModal(); toast("价格已保存");
    }
  });
}

/* Firebase：新表 shops/<key>/state */
function queuePush(){
  if (!FB_URL) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 400);
}
async function pushNow(){
  if (!FB_URL || pushing) return;
  pushing = true; setSync("同步中", false);
  try {
    const payload = JSON.parse(JSON.stringify(state));
    const r = await fetch(FB_URL, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload), cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    setSync("已同步", true);
  } catch (e){ setSync("本地", false); }
  finally { pushing = false; }
}
async function pullNow(){
  if (!FB_URL || pushing) return;
  try {
    const r = await fetch(FB_URL, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const v = await r.json();
    if (!v || !v.updatedAt){
      if ((+state.updatedAt || 0) > 0) queuePush();
      else setSync("已同步", true);
      return;
    }
    if ((+v.updatedAt || 0) > (+state.updatedAt || 0)){
      state = normalize(v); saveLocal(); renderAll(); setSync("已同步", true);
    } else if ((+state.updatedAt || 0) > (+v.updatedAt || 0)){
      queuePush();
    } else {
      setSync("已同步", true);
    }
  } catch (e){ setSync("本地", false); }
}
function initFB(){
  if (!FB_URL){ setSync("本地", false); return; }
  setSync("同步中", false);
  pullNow();
  setInterval(pullNow, 3000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pullNow(); });
}

/* 启动 */
$("#verBtn").textContent = APP_VER;
$("#verBtn").title = "更新日志 · " + APP_DATE;
$("#footVer").textContent = APP_VER;
loadLocal();
if (!state.updatedAt) state.updatedAt = 0;
renderAll();
tick();
setInterval(tick, 1000);
initFB();
})();
